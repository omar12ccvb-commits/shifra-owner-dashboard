<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>شفرة — لوحة المالك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0f;
    --bg-elev:#131318;
    --bg-elev-2:#1c1c24;
    --border:#28282f;
    --border-soft:#1e1e25;
    --text:#f5f4f7;
    --text-dim:#9d9aa8;
    --text-faint:#6b6875;
    --purple:#8b5cf6;
    --purple-hover:#7c3aed;
    --purple-soft:rgba(139,92,246,0.14);
    --purple-soft-2:rgba(139,92,246,0.28);
    --green:#34d399; --green-soft:rgba(52,211,153,0.14);
    --red:#f87171; --red-soft:rgba(248,113,113,0.14);
    --amber:#fbbf24; --amber-soft:rgba(251,191,36,0.14);
    --blue:#60a5fa; --blue-soft:rgba(96,165,250,0.14);
    --radius:12px;
    --radius-sm:8px;
    --font:'IBM Plex Sans Arabic', sans-serif;
    --mono:'IBM Plex Mono', monospace;
    --sidebar-w:252px;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:var(--bg); color:var(--text); font-family:var(--font);
    font-size:14.5px; line-height:1.55; -webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(139,92,246,0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(96,165,250,0.05), transparent 60%);
    background-attachment:fixed;
    overflow-x:hidden;
  }
  .ltr{ direction:ltr; unicode-bidi:isolate; font-family:var(--mono); }
  a{ color:inherit; }
  button{ font-family:inherit; cursor:pointer; }
  ::selection{ background:var(--purple-soft-2); }

  /* ---------- Login ---------- */
  #login-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .login-card{
    width:100%; max-width:400px; background:var(--bg-elev); border:1px solid var(--border);
    border-radius:16px; padding:36px 32px; animation:rise .5s cubic-bezier(.16,1,.3,1);
  }
  @keyframes rise{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:none; } }
  .brand{ display:flex; align-items:center; gap:10px; margin-bottom:28px; }
  .brand-mark{
    width:38px; height:38px; border-radius:10px; background:linear-gradient(155deg, var(--purple), #5b21b6);
    display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-weight:600;
    font-size:15px; color:#fff; flex-shrink:0; box-shadow:0 4px 20px -4px rgba(139,92,246,0.5);
  }
  .brand-text{ font-weight:700; font-size:19px; letter-spacing:.2px; }
  .brand-sub{ color:var(--text-faint); font-size:12px; font-family:var(--mono); direction:ltr; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:12.5px; color:var(--text-dim); margin-bottom:7px; }
  .field input{
    width:100%; background:var(--bg-elev-2); border:1px solid var(--border); color:var(--text);
    border-radius:var(--radius-sm); padding:11px 13px; font-size:14px; font-family:inherit; outline:none;
    transition:border-color .15s;
  }
  .field input:focus{ border-color:var(--purple); }
  .field-hint{ font-size:11.5px; color:var(--text-faint); margin-top:6px; direction:ltr; text-align:end; }
  .btn{
    border:none; border-radius:var(--radius-sm); padding:11px 18px; font-size:14px; font-weight:600;
    transition:filter .15s, transform .1s;
  }
  .btn:active{ transform:scale(.98); }
  .btn-primary{ background:var(--purple); color:#fff; width:100%; }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-primary:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-ghost{ background:transparent; color:var(--text-dim); border:1px solid var(--border); }
  .btn-ghost:hover{ color:var(--text); border-color:var(--text-faint); }
  .btn-sm{ padding:7px 12px; font-size:12.5px; border-radius:7px; }
  .btn-danger{ background:var(--red-soft); color:var(--red); border:1px solid rgba(248,113,113,.3); }
  .btn-danger:hover{ filter:brightness(1.15); }
  .login-error{
    background:var(--red-soft); color:var(--red); border:1px solid rgba(248,113,113,.3);
    border-radius:var(--radius-sm); padding:10px 12px; font-size:13px; margin-bottom:16px; display:none;
  }

  /* ---------- App shell ---------- */
  #app-shell{ display:none; min-height:100vh; }
  #app-shell.active{ display:flex; }
  .sidebar{
    width:var(--sidebar-w); flex-shrink:0; border-inline-start:1px solid var(--border);
    display:flex; flex-direction:column; padding:20px 14px; position:sticky; top:0; height:100vh;
  }
  .sidebar .brand{ padding:0 8px; margin-bottom:22px; }
  .nav-section-label{ font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.6px; padding:14px 12px 6px; }
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:var(--radius-sm);
    color:var(--text-dim); font-size:13.5px; font-weight:500; background:transparent; border:none;
    width:100%; text-align:start; transition:background .12s, color .12s; position:relative;
  }
  .nav-item .ic{ width:18px; text-align:center; flex-shrink:0; font-size:15px; }
  .nav-item:hover{ background:var(--bg-elev); color:var(--text); }
  .nav-item.active{ background:var(--purple-soft); color:#e4d9ff; }
  .nav-item .badge-count{
    margin-inline-start:auto; background:var(--red); color:#fff; font-size:10.5px; font-weight:700;
    border-radius:99px; padding:1px 6px; font-family:var(--mono);
  }
  .sidebar-footer{ margin-top:auto; padding-top:14px; border-top:1px solid var(--border-soft); }
  #nav-list{ display:flex; flex-direction:column; gap:2px; }
  .user-chip{ display:flex; align-items:center; gap:10px; padding:8px 10px; }
  .user-avatar{
    width:32px; height:32px; border-radius:50%; background:var(--bg-elev-2); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600; flex-shrink:0;
  }
  .user-name{ font-size:13px; font-weight:600; }
  .user-role{ font-size:11px; color:var(--text-faint); font-family:var(--mono); direction:ltr; text-align:start; }

  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between; padding:20px 32px;
    border-bottom:1px solid var(--border-soft); flex-wrap:wrap; gap:12px;
  }
  .page-title{ font-size:20px; font-weight:700; }
  .page-sub{ font-size:12.5px; color:var(--text-faint); margin-top:3px; }
  .content{ padding:24px 32px 100px; flex:1; }
  .view{ display:none; animation:fadeup .35s cubic-bezier(.16,1,.3,1); }
  .view.active{ display:block; }
  @keyframes fadeup{ from{ opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }

  /* ---------- Components ---------- */
  .grid{ display:grid; gap:16px; }
  .grid-4{ grid-template-columns:repeat(4,1fr); }
  .grid-2{ grid-template-columns:repeat(2,1fr); }
  @media (max-width:1000px){ .grid-4{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:600px){ .grid-4,.grid-2{grid-template-columns:1fr;} }

  .card{ background:var(--bg-elev); border:1px solid var(--border); border-radius:var(--radius); padding:18px; }
  .stat-card .stat-label{ font-size:12px; color:var(--text-dim); display:flex; align-items:center; gap:6px; }
  .stat-card .stat-value{ font-family:var(--mono); font-size:27px; font-weight:600; margin-top:10px; direction:ltr; text-align:start; }
  .stat-card.warn .stat-value{ color:var(--amber); }
  .stat-card.danger .stat-value{ color:var(--red); }
  .stat-card.ok .stat-value{ color:var(--green); }

  .alert-row{
    display:flex; align-items:center; gap:12px; padding:13px 16px; border-radius:var(--radius-sm);
    border:1px solid var(--border); background:var(--bg-elev); margin-bottom:10px; cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .alert-row:hover{ border-color:var(--purple); background:var(--bg-elev-2); }
  .alert-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .alert-text{ flex:1; font-size:13.5px; }
  .alert-text b{ font-family:var(--mono); direction:ltr; display:inline-block; }
  .alert-arrow{ color:var(--text-faint); font-size:13px; }
  .empty-state{ text-align:center; padding:50px 20px; color:var(--text-faint); }
  .empty-state .ic{ font-size:30px; margin-bottom:10px; }

  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{
    text-align:start; color:var(--text-faint); font-weight:600; font-size:11.5px; text-transform:uppercase;
    letter-spacing:.4px; padding:0 14px 10px; border-bottom:1px solid var(--border);
  }
  td{ padding:13px 14px; border-bottom:1px solid var(--border-soft); vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }
  tbody tr{ transition:background .12s; }
  tbody tr.clickable{ cursor:pointer; }
  tbody tr.clickable:hover{ background:var(--bg-elev-2); }
  .mono{ font-family:var(--mono); direction:ltr; unicode-bidi:isolate; }
  .table-wrap{ background:var(--bg-elev); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; overflow-x:auto; }
  .table-wrap table{ min-width:600px; }
  .table-toolbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px; flex-wrap:wrap; }
  select, .table-toolbar input{
    background:var(--bg-elev-2); border:1px solid var(--border); color:var(--text); border-radius:var(--radius-sm);
    padding:8px 10px; font-size:13px; font-family:inherit; outline:none;
  }

  .badge{
    display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; font-size:11.5px;
    font-weight:600; white-space:nowrap;
  }
  .badge-purple{ background:var(--purple-soft); color:#cbb6ff; }
  .badge-green{ background:var(--green-soft); color:var(--green); }
  .badge-red{ background:var(--red-soft); color:var(--red); }
  .badge-amber{ background:var(--amber-soft); color:var(--amber); }
  .badge-blue{ background:var(--blue-soft); color:var(--blue); }
  .badge-gray{ background:var(--bg-elev-2); color:var(--text-dim); border:1px solid var(--border); }

  .section-title{ font-size:15px; font-weight:700; margin:28px 0 14px; }
  .section-title:first-child{ margin-top:0; }
  .kv{ display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--border-soft); font-size:13px; }
  .kv:last-child{ border-bottom:none; }
  .kv .k{ color:var(--text-dim); }
  .kv .v{ font-weight:600; }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.6); display:none; align-items:center; justify-content:center;
    z-index:50; padding:20px; backdrop-filter:blur(2px);
  }
  .modal-overlay.active{ display:flex; }
  .modal{
    background:var(--bg-elev); border:1px solid var(--border); border-radius:14px; padding:26px;
    width:100%; max-width:440px; animation:rise .3s cubic-bezier(.16,1,.3,1);
  }
  .modal h3{ font-size:16px; margin-bottom:16px; }
  .modal-actions{ display:flex; gap:10px; margin-top:20px; }
  .modal-actions .btn{ flex:1; }
  textarea{
    width:100%; background:var(--bg-elev-2); border:1px solid var(--border); color:var(--text);
    border-radius:var(--radius-sm); padding:10px; font-family:inherit; font-size:13.5px; resize:vertical; min-height:70px; outline:none;
  }
  .toast{
    position:fixed; bottom:24px; inset-inline-end:24px; background:var(--bg-elev-2); border:1px solid var(--border);
    padding:13px 18px; border-radius:var(--radius-sm); font-size:13.5px; z-index:100; box-shadow:0 10px 30px -8px rgba(0,0,0,.5);
    animation:rise .25s cubic-bezier(.16,1,.3,1); max-width:320px;
  }
  .toast.err{ border-color:rgba(248,113,113,.4); color:#fecaca; }
  .toast.ok{ border-color:rgba(52,211,153,.4); color:#bbf7d0; }
  .spinner{
    width:16px; height:16px; border:2px solid rgba(255,255,255,.2); border-top-color:#fff; border-radius:50%;
    display:inline-block; animation:spin .7s linear infinite; vertical-align:middle;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .loading-row{ padding:40px; text-align:center; color:var(--text-faint); }
  .backlink{ display:inline-flex; align-items:center; gap:6px; color:var(--text-dim); font-size:13px; margin-bottom:16px; }
  .backlink:hover{ color:var(--purple); }

  /* ---------- Mobile ---------- */
  .mobile-topbar{ display:none; }
  @media (max-width:880px){
    .sidebar{ position:fixed; bottom:0; top:auto; width:100%; height:auto; flex-direction:row;
      border-inline-start:none; border-top:1px solid var(--border); padding:8px 6px;
      justify-content:space-around; z-index:40; background:var(--bg); gap:2px; overflow-x:auto; }
    .sidebar .brand, .nav-section-label, .sidebar-footer{ display:none; }
    #nav-list{ flex-direction:row; overflow-x:auto; flex:1; }
    .nav-item{ flex-direction:column; gap:3px; padding:8px 10px; font-size:10.5px; flex-shrink:0; width:auto; text-align:center; }
    .nav-item .ic{ font-size:18px; }
    .content{ padding:18px 16px 90px; }
    .topbar{ padding:16px; }
    .mobile-topbar{ display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--border-soft); }
  }
</style>

<style id="shefra-premium-ui">
  :root{
    --brand-a:#9b7cff;
    --brand-b:#6d45ff;
    --brand-c:#38bdf8;
  }
  html{scroll-behavior:smooth;color-scheme:dark}
  body{
    background-image:
      radial-gradient(ellipse 760px 480px at 12% -8%,rgba(155,124,255,.17),transparent 62%),
      radial-gradient(ellipse 700px 460px at 100% 0%,rgba(56,189,248,.08),transparent 68%),
      linear-gradient(180deg,#08080d 0%,#0b0b11 46%,#09090f 100%);
    animation:shefraAmbient 16s ease-in-out infinite alternate;
  }
  @keyframes shefraAmbient{
    0%{background-position:0 0,100% 0,0 0}
    100%{background-position:24px 18px,calc(100% - 18px) 16px,0 0}
  }
  .brand-mark{
    position:relative;overflow:hidden;
    background:radial-gradient(circle at 28% 22%,rgba(255,255,255,.28),transparent 28%),linear-gradient(145deg,var(--brand-a),var(--brand-b) 55%,#4c1d95);
    box-shadow:0 8px 28px -8px rgba(139,92,246,.44),inset 0 1px 0 rgba(255,255,255,.18);
    animation:shefraLogoFloat 4.5s ease-in-out infinite;
  }
  .brand-mark::after{
    content:"";position:absolute;inset:-40% -70%;pointer-events:none;
    background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.34) 50%,transparent 65%);
    transform:translateX(-90%);animation:shefraShine 6s ease-in-out infinite;
  }
  @keyframes shefraLogoFloat{50%{transform:translateY(-2px) rotate(-1deg)}}
  @keyframes shefraShine{0%,62%{transform:translateX(-90%)}78%,100%{transform:translateX(90%)}}
  .brand-text{
    background:linear-gradient(110deg,#fff 0%,#e9e2ff 48%,#c9edff 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .page-title{
    background:linear-gradient(110deg,#fff 0%,#e8dcff 48%,#b7e8ff 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .card,.alert-row,.table-wrap,.login-card{
    transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .25s ease,box-shadow .25s ease,background-color .25s ease;
  }
  .card,.login-card{position:relative;overflow:hidden}
  .card::before,.login-card::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(115deg,rgba(255,255,255,.045),transparent 24%,transparent 75%,rgba(155,124,255,.04));
  }
  .card:hover,.alert-row:hover{
    transform:translateY(-3px);
    border-color:rgba(155,124,255,.30);
    box-shadow:0 18px 44px -28px rgba(0,0,0,.95),0 0 0 1px rgba(155,124,255,.05);
  }
  .login-card{
    box-shadow:0 28px 90px -46px rgba(0,0,0,.9),0 0 0 1px rgba(155,124,255,.05);
  }
  .btn,.nav-item,.user-avatar{
    position:relative;overflow:hidden;
    transition:transform .18s cubic-bezier(.2,.8,.2,1),filter .2s ease,background .2s ease,border-color .2s ease,color .2s ease,box-shadow .2s ease;
  }
  .btn:hover,.nav-item:hover{transform:translateY(-1px)}
  .btn-primary{
    background:linear-gradient(110deg,var(--brand-b),#7c3aed 55%,#5b21b6);
    box-shadow:0 10px 25px -16px rgba(139,92,246,.95),inset 0 1px 0 rgba(255,255,255,.12);
  }
  .btn-primary:hover{filter:brightness(1.1);box-shadow:0 14px 30px -16px rgba(139,92,246,1),0 0 0 1px rgba(255,255,255,.06)}
  .btn:focus-visible,.nav-item:focus-visible,.field input:focus,.field select:focus,.field textarea:focus{
    outline:none;box-shadow:0 0 0 3px rgba(139,92,246,.18),0 0 0 1px rgba(139,92,246,.7)
  }
  .nav-item.active{
    box-shadow:inset 0 0 0 1px rgba(155,124,255,.10),0 8px 20px -18px rgba(155,124,255,.95);
  }
  .nav-item.active::after{
    content:"";position:absolute;inset-inline-start:12px;inset-inline-end:12px;bottom:2px;height:2px;border-radius:999px;
    background:linear-gradient(90deg,transparent,var(--brand-a),transparent);animation:shefraPulse 2.1s ease-in-out infinite;
  }
  @keyframes shefraPulse{50%{opacity:.35;transform:scaleX(.78)}}
  .table-wrap{box-shadow:0 16px 48px -34px rgba(0,0,0,.9)}
  tbody tr.clickable{transition:background .18s ease,transform .18s ease,box-shadow .18s ease}
  tbody tr.clickable:hover{transform:translateX(-2px)}
  .modal-overlay{backdrop-filter:blur(8px)!important;background:rgba(2,2,8,.64)!important}
  .modal{background:linear-gradient(180deg,rgba(25,25,34,.97),rgba(17,17,24,.97))!important;box-shadow:0 28px 90px -30px rgba(0,0,0,.96),0 0 0 1px rgba(155,124,255,.07)}
  #content.ui-refresh > *{animation:shefraRouteIn .48s cubic-bezier(.16,1,.3,1) both}
  #content.ui-refresh .card,#content.ui-refresh .table-wrap,#content.ui-refresh .alert-row{animation:shefraCardIn .52s cubic-bezier(.16,1,.3,1) both}
  #content.ui-refresh > *:nth-child(2){animation-delay:.035s}
  #content.ui-refresh > *:nth-child(3){animation-delay:.07s}
  #content.ui-refresh > *:nth-child(4){animation-delay:.105s}
  @keyframes shefraRouteIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes shefraCardIn{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
  .ui-ripple{
    position:absolute!important;border-radius:999px;pointer-events:none;width:18px;height:18px;
    transform:translate(-50%,-50%) scale(0);background:rgba(255,255,255,.22);animation:shefraRipple .55s ease-out forwards;
  }
  @keyframes shefraRipple{to{transform:translate(-50%,-50%) scale(14);opacity:0}}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#292934;border-radius:999px}
  ::-webkit-scrollbar-thumb:hover{background:#3a3a49}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.001ms!important}
  }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="brand">
      <div class="brand-mark">ش</div>
      <div>
        <div class="brand-text">شفرة</div>
        <div class="brand-sub">OWNER CONSOLE</div>
      </div>
    </div>
    <div class="login-error" id="login-error"></div>
    <form id="login-form">
      <div class="field">
        <label>البريد الإلكتروني أو الهاتف</label>
        <input type="text" id="login-identifier" class="ltr" placeholder="omar@shifra.internal" autocomplete="username" required>
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <input type="password" id="login-password" class="ltr" autocomplete="current-password" required>
      </div>
      <div class="field">
        <label>عنوان السيرفر (API Base URL)</label>
        <input type="text" id="login-apibase" class="ltr" value="https://api-production-2964.up.railway.app/api">
        <div class="field-hint">owner accounts only</div>
      </div>
      <button type="submit" class="btn btn-primary" id="login-submit">دخول</button>
    </form>
  </div>
</div>

<div id="app-shell">
  <nav class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">ش</div>
      <div>
        <div class="brand-text" style="font-size:16px">شفرة</div>
        <div class="brand-sub" style="font-size:10.5px">OWNER CONSOLE</div>
      </div>
    </div>
    <div id="nav-list"></div>
    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="user-avatar" id="user-avatar">?</div>
        <div>

<script>
/* ============================================================
   شفرة Owner Console — talks to the REAL backend only.
   No cached numbers, no mock data: every view fetches from the
   live API each time it's opened (spec #54 "Database-backed KPIs").
   Session token lives in memory only (not localStorage) — closing
   the tab requires logging back in, which is the right trade-off
   for a console that can confirm real money movements.
   ============================================================ */
const state = { token:null, user:null, apiBase:'http://localhost:4000/api', view:'overview', cache:{} };

// Same smart default as the main app: deployed anywhere other than localhost,
// assume /api lives on this same origin (nginx reverse-proxy setup) -- still
// a plain editable field either way.
(function setSmartApiDefault(){
  const isLocal = ['localhost','127.0.0.1'].includes(location.hostname) || location.protocol === 'file:';
  const guess = isLocal ? 'http://localhost:4000/api' : 'https://api-production-2964.up.railway.app/api';
  state.apiBase = guess;
  document.getElementById('login-apibase').value = guess;
})();

function toast(msg, kind){
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' '+kind : '');
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(()=> el.remove(), 4200);
}

async function api(path, opts={}){
  const res = await fetch(state.apiBase + path, {
    method: opts.method || 'GET',
    headers: Object.assign({'Content-Type':'application/json'}, state.token ? {Authorization:'Bearer '+state.token} : {}),
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  }).catch(()=>{ throw new Error('تعذر الوصول للسيرفر — تأكد إن الباك إند شغال على ' + state.apiBase); });
  let json = {};
  try { json = await res.json(); } catch(e) {}
  if(!res.ok){
    if(res.status === 401){ doLogout(); }
    throw new Error((json.error && json.error.message) || ('HTTP ' + res.status));
  }
  return json;
}

const money = (minor) => (Number(minor)/100).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
const fmtDate = (d) => d ? new Date(d).toLocaleString('ar-EG', {dateStyle:'medium', timeStyle:'short'}) : '—';
const fmtDay = (d) => d ? new Date(d).toLocaleDateString('ar-EG', {dateStyle:'medium'}) : '—';
function esc(s){ const d=document.createElement('div'); d.textContent = (s===null||s===undefined)?'':s; return d.innerHTML; }

const STATUS_BADGE = {
  NEW:'gray', CLIENT_ASSIGNED:'gray', DETAILS_COLLECTED:'gray', PRICE_NEGOTIATION:'amber',
  PRICE_ACCEPTED:'blue', PRICE_LOCKED:'blue', PAYMENT_PENDING:'amber', PAYMENT_CONFIRMED:'blue',
  EDITOR_ASSIGNED:'purple', IN_PRODUCTION:'purple', PREVIEW_READY:'purple', REVISION_REQUESTED:'amber',
  FINAL_APPROVED:'blue', READY_FOR_DELIVERY:'blue', DELIVERED:'green', ELIGIBLE_FOR_SETTLEMENT:'green',
  REJECTED:'red', CANCELLED:'red', PAYMENT_FAILED:'red', REVIEW_REQUIRED:'red', REFUNDED:'red',
  PENDING:'gray', PROOF_SUBMITTED:'amber', CONFIRMED:'green', PROOF_REJECTED:'red', FAILED:'red',
  READY:'blue', PROCESSING:'blue', PAID:'green', OPEN:'amber', CLOSED:'gray',
};
function badge(status){ return `<span class="badge badge-${STATUS_BADGE[status]||'gray'}">${esc(status)}</span>`; }

function modal(html){
  document.getElementById('modal-inner').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('active');
}
function closeModal(){ document.getElementById('modal-overlay').classList.remove('active'); }
document.getElementById('modal-overlay').addEventListener('click', (e)=>{ if(e.target.id==='modal-overlay') closeModal(); });

/* ---------------- Auth ---------------- */
document.getElementById('login-form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn = document.getElementById('login-submit');
  const errBox = document.getElementById('login-error');
  errBox.style.display = 'none';
  state.apiBase = document.getElementById('login-apibase').value.trim().replace(/\/$/,'');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  try{
    const identifier = document.getElementById('login-identifier').value.trim();
    const password = document.getElementById('login-password').value;
    const { token } = await api('/auth/login', { method:'POST', body:{identifier, password} });
    state.token = token;
    const me = await api('/auth/me');
    if(me.user.role !== 'OWNER'){ throw new Error('هذه اللوحة لأصحاب الحساب (Omar/Youssef) فقط'); }
    state.user = me.user;
    enterApp();
  }catch(err){
    errBox.textContent = err.message; errBox.style.display = 'block';
  }finally{
    btn.disabled = false; btn.textContent = 'دخول';
  }
});

function doLogout(){
  state.token = null; state.user = null;
  document.getElementById('app-shell').classList.remove('active');
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-password').value = '';
}
document.getElementById('logout-btn').addEventListener('click', doLogout);
document.getElementById('logout-btn-mobile').addEventListener('click', doLogout);

function openChangePasswordModal(){
  modal(`<h3>تغيير كلمة المرور</h3>
    <div class="field"><label>كلمة المرور الحالية</label><input type="password" id="cp-current" class="ltr"></div>
    <div class="field"><label>كلمة المرور الجديدة (8 أحرف على الأقل)</label><input type="password" id="cp-new" class="ltr"></div>
    <div class="field"><label>تأكيد كلمة المرور الجديدة</label><input type="password" id="cp-confirm" class="ltr"></div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">إلغاء</button>
      <button class="btn btn-primary" id="cp-submit">تغيير</button></div>`);
  document.getElementById('cp-submit').addEventListener('click', async (e) => {
    const current = document.getElementById('cp-current').value;
    const next = document.getElementById('cp-new').value;
    const confirmVal = document.getElementById('cp-confirm').value;
    if (!current || !next) { toast('املا الخانتين', 'err'); return; }
    if (next.length < 8) { toast('كلمة المرور الجديدة لازم 8 أحرف على الأقل', 'err'); return; }
    if (next !== confirmVal) { toast('كلمة المرور الجديدة والتأكيد مش متطابقين', 'err'); return; }
    e.target.disabled = true;
    try {
      await api('/auth/change-password', {method:'POST', body:{currentPassword: current, newPassword: next}});
      closeModal(); toast('اتغيّرت كلمة المرور بنجاح', 'ok');
    } catch(err){ toast(err.message, 'err'); e.target.disabled = false; }
  });
}
document.getElementById('change-pw-btn').addEventListener('click', openChangePasswordModal);
document.getElementById('change-pw-btn-mobile').addEventListener('click', openChangePasswordModal);

async function goView(id){
  state.view = id;
  document.querySelectorAll('.nav-item').forEach(b=> b.classList.toggle('active', b.dataset.view===id));
  document.getElementById('page-title').textContent = VIEW_META[id].title;
  document.getElementById('page-sub').textContent = VIEW_META[id].sub;
  document.getElementById('topbar-actions').innerHTML = '';
  const content = document.getElementById('content');
  // Fresh entry into a section should never inherit a stale drill-down/filter
  // from a previous visit -- innerHTML resets below don't clear data-* attrs.
  delete content.dataset.detail;
  delete content.dataset.filter;
  content.innerHTML = '<div class="loading-row"><span class="spinner"></span> جارِ التحميل...</div>';
  try{
    await RENDERERS[id](content);
  }catch(err){
    content.innerHTML = `<div class="empty-state"><div class="ic">⚠</div>${esc(err.message)}</div>`;
  }
}
const RENDERERS = {}; // filled in below, one per view


function opCard(icon,label,action,tone){
  return '<button class="card feature-card '+(tone||'')+'" data-op="'+action+'" style="text-align:start;border:none;width:100%;cursor:pointer"><div style="font-size:18px;margin-bottom:6px">'+icon+'</div><div style="font-weight:700">'+esc(label)+'</div></button>';
}
function downloadRowsCsv(filename, rows){
  if(!rows || !rows.length){ toast('مفيش بيانات للتصدير','err'); return; }
  var keys=Object.keys(rows[0]);
  var csv='\\uFEFF'+[keys.join(','), rows.map(function(r){return keys.map(function(k){return '"'+String(r[k]??'').replace(/"/g,'""')+'"';}).join(',');}).join('\\n')].join('\\n');
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}), url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=filename; a.click(); setTimeout(function(){URL.revokeObjectURL(url);},500);
}
RENDERERS.operations = async function(el){
  var data=await Promise.all([
    api('/projects'), api('/payments'), api('/payouts'), api('/complaints'), api('/weekly-cycles/current')
  ]);
  var projects=data[0].projects, payments=data[1].payments, payouts=data[2].payouts, complaints=data[3].complaints, cycle=data[4].cycle;
  var now=Date.now(), terminal=['DELIVERED','CANCELLED','REJECTED','REFUNDED','ELIGIBLE_FOR_SETTLEMENT'];
  var active=projects.filter(function(p){return terminal.indexOf(p.status)<0;});
  var overdue=active.filter(function(p){return p.deadline && new Date(p.deadline).getTime()<now;});
  var soon=active.filter(function(p){return p.deadline && new Date(p.deadline).getTime()>=now && new Date(p.deadline).getTime()<now+48*3600*1000;});
  var pendingProofs=payments.filter(function(p){return p.status==='PROOF_SUBMITTED';});
  var confirmedPayments=payments.filter(function(p){return p.status==='CONFIRMED';});

  var paidPayouts=payouts.filter(function(p){return p.status==='PAID';});
  var failedPayouts=payouts.filter(function(p){return p.status==='FAILED';});
  var openComplaints=complaints.filter(function(c){return c.status==='OPEN';});
  var reviewComplaints=complaints.filter(function(c){return c.status==='IN_REVIEW';});
  var common=[
    opCard('💳','طابور إثباتات الدفع ('+pendingProofs.length+')','pending-payments','warn'),
    opCard('✅','المدفوعات المؤكدة ('+confirmedPayments.length+')','confirmed-payments','ok'),
    opCard('📦','المشاريع النشطة ('+active.length+')','active-projects'),
    opCard('🚨','المشاريع المتأخرة ('+overdue.length+')','overdue-projects','warn'),
    opCard('⏰','المشاريع خلال 48 ساعة ('+soon.length+')','deadline-48'),
    opCard('⚠️','الشكاوى المفتوحة ('+openComplaints.length+')','open-complaints','warn'),
    opCard('🧐','الشكاوى قيد المراجعة ('+reviewComplaints.length+')','review-complaints'),
    opCard('💰','المستحقات الجاهزة ('+readyPayouts.length+')','ready-payouts'),
    opCard('💸','المستحقات المدفوعة ('+paidPayouts.length+')','paid-payouts','ok'),
    opCard('❌','المستحقات الفاشلة ('+failedPayouts.length+')','failed-payouts','warn'),
    opCard('💬','كل المحادثات','conversations'),
    opCard('👥','كل المشاريع','projects'),
    opCard('🧾','سجل التدقيق','audit'),
    opCard('📚','Ledger','ledger'),
    opCard('🗓️','الدورة الأسبوعية','weekly'),
    opCard('🔁','توزيع الأرباح','profitsplit'),
    opCard('❤️','فحص API','health'),
    opCard('🔄','تحديث البيانات','refresh'),
    opCard('📊','إجمالي المدفوع المؤكد','payment-total'),
    opCard('💵','إجمالي المستحقات','payout-total'),
    opCard('⇩','تصدير المشاريع','export-projects'),
    opCard('⇩','تصدير المدفوعات','export-payments')
  ];
  var role=[];
  if(state.user.ownerKey==='OMAR'){
    role=[
      opCard('👤','إدارة حساب يوسف','youssef'),
      opCard('🧠','مركز الأرباح والنسب','profitsplit'),
      opCard('🧮','مطابقة الدورة','reconciliation'),
      opCard('⚙️','توليد مستحقات الدورة الحالية','generate-payouts'),
      opCard('🛡️','الأمان والحساب','security'),
      opCard('⇩','تصدير Ledger','export-ledger'),
      opCard('⇩','تصدير الشكاوى','export-complaints'),
      opCard('⇩','تصدير سجل التدقيق','export-audit')
    ];
  } else {
    role=[
      opCard('🔎','الدفع المطلوب مراجعته','pending-payments'),
      opCard('✅','مراجعة واعتماد الدفع','pending-payments'),
      opCard('↩️','رفض إثبات الدفع مع سبب','pending-payments'),
      opCard('💸','قائمة المستحقات الجاهزة للصرف','ready-payouts'),
      opCard('✅','تأكيد التحويلات','ready-payouts'),
      opCard('❌','تسجيل فشل التحويل','ready-payouts'),

      if(a==='payment-total'){var s=confirmedPayments.reduce(function(x,p){return x+Number(p.expected_amount_minor||0);},0);modal('<h3>إجمالي المدفوعات المؤكدة</h3><div class="price-hero"><div class="amt">'+money(s)+' EGP</div></div>');}
      if(a==='payout-total'){var q=payouts.reduce(function(x,p){return x+Number(p.total_amount_minor||0);},0);modal('<h3>إجمالي المستحقات المسجلة</h3><div class="price-hero"><div class="amt">'+money(q)+' EGP</div></div>');}

      }
      if(a==='export-projects')downloadRowsCsv('shifra-projects.csv',projects);

};

      '<div class="card stat-card ok"><div class="stat-label">حسابات نشطة</div><div class="stat-value">'+accounts.filter(a=>a.status==='ACTIVE').length+'</div></div>'+
      '<div class="card stat-card danger"><div class="stat-label">حسابات محظورة</div><div class="stat-value">'+accounts.filter(a=>a.status==='SUSPENDED').length+'</div></div>'+
      '<div class="card stat-card"><div class="stat-label">حسابك</div><div class="stat-value" style="font-size:16px">'+esc(ownerKey||'OWNER')+'</div></div>'+
    '</div>'+
    '<div class="card" style="margin-bottom:16px">'+
      '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">'+
        '<input id="accounts-search" placeholder="ابحث بالاسم أو البريد أو الهاتف..." style="flex:1;min-width:220px">'+
        '<select id="accounts-role"><option value="">كل الأدوار</option><option value="CUSTOMER">عملاء</option><option value="MARKETER">مسوقين</option><option value="EDITOR">مونتيرين</option><option value="ADMIN">إدارة</option><option value="OWNER">ملّاك</option></select>'+
        '<select id="accounts-status"><option value="">كل الحالات</option><option value="ACTIVE">نشط</option><option value="SUSPENDED">محظور</option></select>'+
      '</div>'+
    '</div>'+
    '<div class="table-wrap"><table><thead><tr><th>الحساب</th><th>الدور</th><th>الحالة</th><th>المشاريع</th><th>الأرباح</th><th>الجلسات</th><th>إجراء</th></tr></thead><tbody id="accounts-tbody"></tbody></table></div>';
  const tbody=document.getElementById('accounts-tbody');
  function renderRows(){
    const q=(document.getElementById('accounts-search').value||'').toLowerCase().trim();
    const role=document.getElementById('accounts-role').value;
    const status=document.getElementById('accounts-status').value;
    const filtered=accounts.filter(a=>{
      const hay=[a.full_name,a.email,a.phone].filter(Boolean).join(' ').toLowerCase();
      return (!q||hay.includes(q))&&(!role||a.role===role)&&(!status||a.status===status);
    });
    if(!filtered.length){tbody.innerHTML='<tr><td colspan="7"><div class="empty-state" style="padding:28px">مفيش حسابات بالمواصفات دي.</div></td></tr>';return;}
    tbody.innerHTML=filtered.map(a=>{
      const isOwner=a.role==='OWNER';
      const isMe=Number(a.id)===Number(state.user.id);
      const banned=a.status==='SUSPENDED';
      const action=isOwner||isMe
        ? '<span class="badge badge-gray">'+(isMe?'حسابك':'حماية مالك')+'</span>'
        : '<button class="btn btn-sm '+(banned?'btn-primary':'btn-danger')+'" data-account-status="'+a.status+'" data-account-id="'+a.id+'">'+(banned?'إعادة تفعيل':'حظر الحساب')+'</button>';
      return '<tr>'+
        '<td><div style="font-weight:700">'+esc(a.full_name)+'</div><div style="font-size:11px;color:var(--text-faint)">'+esc(a.email||a.phone||'بدون وسيلة اتصال')+'</div></td>'+
        '<td>'+esc(roleLabel[a.role]||a.role)+'</td>'+
        '<td><span class="badge '+(a.status==='ACTIVE'?'badge-green':'badge-red')+'">'+esc(statusLabel[a.status]||a.status)+'</span></td>'+
        '<td class="mono">'+Number(a.related_projects||0)+'</td>'+
        '<td class="mono">'+money(a.total_earnings_minor||0)+' EGP</td>'+
        '<td class="mono">'+Number(a.active_sessions||0)+'</td>'+
        '<td style="white-space:nowrap">'+action+'</td>'+
      '</tr>';
    }).join('');
    tbody.querySelectorAll('[data-account-id]').forEach(btn=>{
      btn.addEventListener('click',async()=>{
        const id=btn.dataset.accountId;
        const next=btn.dataset.accountStatus==='SUSPENDED'?'ACTIVE':'SUSPENDED';
        const account=accounts.find(a=>String(a.id)===String(id));
        if(!account)return;
        if(next==='SUSPENDED' && !confirm('حظر حساب '+account.full_name+'؟ سيتم إنهاء جلساته الحالية.'))return;
        btn.disabled=true;
        try{
          await api('/accounts/'+id+'/status',{method:'POST',body:{status:next}});
          toast(next==='SUSPENDED'?'تم حظر الحساب':'تم إعادة تفعيل الحساب','ok');
          RENDERERS.accounts(el);
        }catch(err){toast(err.message,'err');btn.disabled=false;}
      });
    });
  }
  ['accounts-search','accounts-role','accounts-status'].forEach(id=>document.getElementById(id).addEventListener('input',renderRows));
  renderRows();
};

/* ================= OVERVIEW ================= */
RENDERERS.overview = async (el) => {
  const [payments, payouts, projects, cycle] = await Promise.all([
    api('/payments?status=PROOF_SUBMITTED'),
    api('/payouts'),
    api('/projects'),
    api('/weekly-cycles/current'),
  ]);
  const pendingProofs = payments.payments.length;
  const readyPayouts = payouts.payouts.filter(p => ['PENDING','READY'].includes(p.status)).length;
  const failedPayouts = payouts.payouts.filter(p => ['FAILED','REVIEW_REQUIRED'].includes(p.status)).length;
  const now = new Date();
  const terminal = ['DELIVERED','ELIGIBLE_FOR_SETTLEMENT','CANCELLED','REJECTED','REFUNDED'];
  const overdue = projects.projects.filter(p => p.deadline && new Date(p.deadline) < now && !terminal.includes(p.status));
  const active = projects.projects.filter(p => !terminal.includes(p.status) && !['CANCELLED','REJECTED'].includes(p.status));

  let recon = null;
  try { recon = await api(`/weekly-cycles/${cycle.cycle.id}/reconciliation`); } catch(e) {}

  const alerts = [];
  if (pendingProofs > 0) alerts.push({dot:'red', text:`<b>${pendingProofs}</b> إثبات دفع محتاج مراجعة`, view:'payments'});
  if (readyPayouts > 0) alerts.push({dot:'amber', text:`<b>${readyPayouts}</b> مستحق جاهز للصرف`, view:'payouts'});
  if (failedPayouts > 0) alerts.push({dot:'red', text:`<b>${failedPayouts}</b> صرف فشل أو محتاج مراجعة`, view:'payouts'});
  if (overdue.length > 0) alerts.push({dot:'red', text:`<b>${overdue.length}</b> مشروع متأخر عن الديدلاين`, view:'projects'});
  if (recon && recon.result === 'MISMATCH') alerts.push({dot:'amber', text:`Mismatch مالي في الدورة الحالية (فرق ${money(Math.abs(recon.differenceMinor))} EGP)`, view:'weekly'});

  el.innerHTML = `
    <div class="grid grid-4" style="margin-bottom:26px">
      <div class="card stat-card"><div class="stat-label">مشاريع نشطة</div><div class="stat-value">${active.length}</div></div>
      <div class="card stat-card ${pendingProofs?'warn':'ok'}"><div class="stat-label">إثباتات دفع تنتظر المراجعة</div><div class="stat-value">${pendingProofs}</div></div>
      <div class="card stat-card ${readyPayouts?'warn':'ok'}"><div class="stat-label">مستحقات جاهزة للصرف</div><div class="stat-value">${readyPayouts}</div></div>
      <div class="card stat-card"><div class="stat-label">الدورة الحالية</div><div class="stat-value" style="font-size:16px">${fmtDay(cycle.cycle.cycle_start)} → ${fmtDay(cycle.cycle.cycle_end)}</div></div>
    </div>
    <div class="section-title">يحتاج انتباهك</div>
    <div id="alerts-list"></div>
  `;
  const list = document.getElementById('alerts-list');
  if (alerts.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="ic">✓</div>كل حاجة تمام — مفيش حاجة محتاجة تدخّل دلوقتي.</div>`;
  } else {
    list.innerHTML = alerts.map(a => `
      <div class="alert-row" data-view="${a.view}">
        <span class="alert-dot" style="background:var(--${a.dot})"></span>
        <span class="alert-text">${a.text}</span>
        <span class="alert-arrow">‹</span>
      </div>`).join('');
    list.querySelectorAll('.alert-row').forEach(row => row.addEventListener('click', () => goView(row.dataset.view)));
  }
};

  try {
    const [{project}, {messages}] = await Promise.all([
      api(`/projects/${projectId}`),
      api(`/projects/${projectId}/messages`),
    ]);
    panel.innerHTML = `
      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px">

/* ================= FINAL RELEASE PAYMENTS ================= */
RENDERERS.finalPayments = async function(el){
  const {cases}=await api('/release-payments');
  const isYoussef=state.user.ownerKey==='YOUSSEF';
  const statusLabel={
    NEEDS_QUOTE:'يحتاج تسعير',
    WAITING_PAYMENT:'بانتظار الدفع',
    PROOF_SUBMITTED:'إثبات يحتاج مراجعة',
    PAID:'مدفوع — إطلاق الأصل',
    REJECTED:'مرفوض',
    CANCELLED:'ملغى'
  };
  const waPhone=function(phone){
    const d=String(phone||'').replace(/\D/g,'');
    if(!d)return '';
    if(d.startsWith('0'))return '20'+d.slice(1);
    if(d.startsWith('20'))return d;
    return d;
  };
  if(!cases.length){
    el.innerHTML='<div class="empty-state"><div class="ic">🎬</div>مفيش حالات تسليم نهائي حالياً.</div>';
    return;
  }
  el.innerHTML=
    '<div class="card" style="margin-bottom:16px">'+
      '<div style="font-weight:800;font-size:16px">بوابة التسليم الأصلّي</div>'+
      '<div style="font-size:12px;color:var(--text-faint);margin-top:5px">الأصل لا يُطلق للمسوق إلا بعد تأكيد يوسف للدفع. كل حالة توضح العميل + المسوق + المونتير + ملخص المسوق.</div>'+
      (!isYoussef?'<div style="margin-top:10px"><span class="badge badge-gray">إدارة فقط — تسعير وتأكيد الدفع من يوسف</span></div>':'')+
    '</div>'+
    '<div class="grid grid-2">'+cases.map(c=>{
      const status=statusLabel[c.status]||c.status;
      const phone=waPhone(c.marketer_phone);
      const price=c.amount_minor?money(c.amount_minor)+' '+(c.currency||'EGP'):'لم يتحدد';
      return '<div class="card" style="margin-bottom:14px">'+
        '<div class="list-card-top"><span class="mono">'+esc(c.order_number)+'</span><span class="badge '+(c.status==='PAID'?'badge-green':c.status==='PROOF_SUBMITTED'?'badge-amber':'badge-purple')+'">'+esc(status)+'</span></div>'+
        '<div class="kv"><span class="k">العميل</span><span class="v">'+esc(c.customer_name)+'</span></div>'+
        '<div class="kv"><span class="k">المسوق المسؤول</span><span class="v">'+esc(c.marketer_name)+'</span></div>'+
        '<div class="kv"><span class="k">المونتير المسؤول</span><span class="v">'+esc(c.editor_name)+'</span></div>'+
        '<div class="kv"><span class="k">المبلغ</span><span class="v mono">'+price+'</span></div>'+
        '<div class="kv"><span class="k">طريقة الدفع</span><span class="v">'+esc(c.method||'—')+'</span></div>'+
        (c.proof_reference?'<div class="kv"><span class="k">مرجع الإثبات</span><span class="v mono">'+esc(c.proof_reference)+'</span></div>':'')+
        '<div style="margin-top:10px;padding:10px;border-radius:10px;background:var(--bg-elev-2);font-size:12.5px"><b>ملخص المسوق:</b><br>'+esc(c.marketer_summary||'—')+'</div>'+
        '<div class="btn-row" style="margin-top:11px;flex-wrap:wrap">'+
          (phone?'<a class="btn btn-ghost btn-sm" target="_blank" rel="noopener" href="https://wa.me/'+phone+'?text='+encodeURIComponent('بخصوص المشروع '+c.order_number+' — التسليم النهائي')+'">WhatsApp المسوق</a>':'')+
          (isYoussef && ['NEEDS_QUOTE','REJECTED'].includes(c.status)?'<button class="btn btn-primary btn-sm" data-release-quote="'+c.id+'">حدد المبلغ والطريقة</button>':'')+
          (isYoussef && c.status==='PROOF_SUBMITTED'?'<button class="btn btn-primary btn-sm" data-release-verify="'+c.id+'">تأكيد استلام الدفع</button>':'')+
        '</div>'+
      '</div>';
    }).join('')+'</div>';

  el.querySelectorAll('[data-release-quote]').forEach(btn=>btn.addEventListener('click',()=>{
    const c=cases.find(x=>String(x.id)===String(btn.dataset.releaseQuote));
    modal('<h3>تحديد الدفع النهائي — '+esc(c.order_number)+'</h3>'+
      '<div class="field"><label>المبلغ EGP</label><input id="rp-amount" type="number" class="ltr" min="1"></div>'+
      '<div class="field"><label>طريقة الدفع</label><input id="rp-method" placeholder="Vodafone Cash / InstaPay / تحويل بنكي / كاش"></div>'+
      '<div class="field"><label>تعليمات الدفع</label><textarea id="rp-instructions" rows="3" placeholder="اكتب رقم التحويل أو تعليمات الدفع للعميل..."></textarea></div>'+

      if(!amount||!method){toast('اكتب المبلغ وطريقة الدفع','err');return;}
      try{
        await api('/release-payments/'+c.id+'/quote',{method:'PATCH',body:{amountEgp:amount,method,instructions}});
        closeModal();toast('اتبعت تفاصيل الدفع للعميل والمسوق','ok');RENDERERS.finalPayments(el);
      }catch(err){toast(err.message,'err');}
    });
  }));

  el.querySelectorAll('[data-release-verify]').forEach(btn=>btn.addEventListener('click',async()=>{
    btn.disabled=true;
    try{
      await api('/release-payments/'+btn.dataset.releaseVerify+'/verify',{method:'POST'});
      toast('تم تأكيد الدفع وإطلاق صلاحية الفيديو الأصلي للمونتير','ok');RENDERERS.finalPayments(el);
    }catch(err){toast(err.message,'err');btn.disabled=false;}
  }));
};

      <tbody>${earningsRes.earnings.map(e=>`<tr><td>${esc(e.recipient_type)}</td><td class="mono">${money(e.amount_minor)} EGP</td><td class="mono">${fmtDate(e.eligible_at)}</td></tr>`).join('')}</tbody></table>`

/* ================= PAYOUTS ================= */
RENDERERS.payouts = async (el) => {
  const isYoussef = state.user.ownerKey === 'YOUSSEF';
  const cycleRes = await api('/weekly-cycles/current');
  const cycleId = cycleRes.cycle.id;
  const { payouts } = await api('/payouts?weeklyCycleId=' + cycleId);

  document.getElementById('topbar-actions').innerHTML =
    `<button class="btn btn-primary btn-sm" id="gen-payouts">تجميع مستحقات الدورة الحالية</button>`;
  document.getElementById('gen-payouts').addEventListener('click', async (e) => {
    e.target.disabled = true;
    try { const r = await api('/payouts/generate', {method:'POST', body:{weeklyCycleId: cycleId}});
      toast(`${r.payouts.length} مستحق جديد اتضاف`, 'ok'); RENDERERS.payouts(el); }
    catch(err){ toast(err.message, 'err'); e.target.disabled = false; }
  });

  el.innerHTML = `
    <div class="badge badge-gray" style="margin-bottom:16px">الدورة: ${fmtDay(cycleRes.cycle.cycle_start)} → ${fmtDay(cycleRes.cycle.cycle_end)} · ${badge(cycleRes.cycle.status)}</div>
    <div class="table-wrap" id="payouts-table"></div>
  `;
  const wrap = document.getElementById('payouts-table');
  if (!payouts.length) { wrap.outerHTML = `<div class="empty-state"><div class="ic">⇄</div>لسه مفيش مستحقات للدورة دي — دوس "تجميع مستحقات الدورة الحالية"</div>`; return; }
  wrap.innerHTML = `<table><thead><tr><th>المستفيد</th><th>النوع</th><th>المبلغ</th><th>الحالة</th><th>مرجع</th><th></th></tr></thead>
    <tbody>${payouts.map(p => `
      <tr>
        <td class="mono">#${esc(p.recipient_user_id)}</td>
        <td>${esc(p.recipient_type)}</td>
        <td class="mono">${money(p.total_amount_minor)} EGP</td>
        <td>${badge(p.status)}</td>
        <td class="mono">${esc(p.reference || '—')}</td>
        <td style="white-space:nowrap">
          ${isYoussef && ['PENDING','READY','PROCESSING'].includes(p.status) ? `
            <button class="btn btn-sm btn-primary" data-confirm="${p.id}">تأكيد الصرف</button>
            <button class="btn btn-sm btn-danger" data-fail="${p.id}">فشل</button>` : ''}
        </td>
      </tr>`).join('')}</tbody></table>`;

  wrap.querySelectorAll('[data-confirm]').forEach(btn => btn.addEventListener('click', () => {
    modal(`<h3>تأكيد صرف مستحق</h3>
      <div class="field"><label>مرجع التحويل (Vodafone Cash)</label><input type="text" id="payout-ref" class="ltr"></div>
      <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">إلغاء</button>
        <button class="btn btn-primary" id="confirm-payout-btn">تأكيد</button></div>`);
    document.getElementById('confirm-payout-btn').addEventListener('click', async () => {
      try { await api(`/payouts/${btn.dataset.confirm}/confirm`, {method:'POST', body:{reference: document.getElementById('payout-ref').value}});
        closeModal(); toast('تم تأكيد الصرف','ok'); RENDERERS.payouts(el); }
      catch(err){ toast(err.message,'err'); }
    });
  }));
  wrap.querySelectorAll('[data-fail]').forEach(btn => btn.addEventListener('click', async () => {
    try { await api(`/payouts/${btn.dataset.fail}/mark-failed`, {method:'POST', body:{notes:'Marked from dashboard'}}); toast('اتسجل كفاشل','ok'); RENDERERS.payouts(el); }
    catch(err){ toast(err.message,'err'); }
  }));
};

        <div class="kv"><span class="k">Editor</span><span class="v mono">${profitSplit?.editor_pct}%</span></div>
        <div class="kv"><span class="k">Omar</span><span class="v mono">${profitSplit?.owner_omar_pct}%</span></div>
        <div class="kv"><span class="k">Youssef</span><span class="v mono">${profitSplit?.owner_youssef_pct}%</span></div>
      </div>
      <div class="card">
        <div class="section-title" style="margin-top:0">نسخة جديدة (لازم المجموع = 100%)</div>
        <div class="field"><label>Client Hunter %</label><input type="number" id="sp-ch" class="ltr" value="10" step="0.01"></div>
        <div class="field"><label>Editor %</label><input type="number" id="sp-ed" class="ltr" value="64" step="0.01"></div>
        <div class="field"><label>Omar %</label><input type="number" id="sp-om" class="ltr" value="13" step="0.01"></div>
        <div class="field"><label>Youssef %</label><input type="number" id="sp-yo" class="ltr" value="13" step="0.01"></div>
        <button class="btn btn-primary" id="save-split">حفظ نسخة جديدة</button>
      </div>
    </div>
    <div class="section-title">تاريخ النسخ</div>
    <div class="table-wrap"><table><thead><tr><th>النسخة</th><th>Hunter</th><th>Editor</th><th>Omar</th><th>Youssef</th><th>الحالة</th></tr></thead>
      <tbody>${profitSplits.map(s=>`<tr><td class="mono">v${s.version}</td><td class="mono">${s.client_hunter_pct}%</td><td class="mono">${s.editor_pct}%</td><td class="mono">${s.owner_omar_pct}%</td><td class="mono">${s.owner_youssef_pct}%</td><td>${s.is_active?badge('CONFIRMED'):'—'}</td></tr>`).join('')}</tbody></table></div>

  });
};

<script id="shefra-premium-motion">
(() => {
  const install = () => {
    const content = document.getElementById('content');
    if (content) {
      const pulse = () => {
        content.classList.remove('ui-refresh');
        requestAnimationFrame(() => content.classList.add('ui-refresh'));
      };
      new MutationObserver(pulse).observe(content,{childList:true});
    }
    document.addEventListener('click', (event) => {
      const target = event.target.closest('button,.btn,.nav-item,.auth-tab,.role-opt,.user-menu-btn');
      if (!target || target.disabled) return;
      const rect = target.getBoundingClientRect();
      const ripple = document.createElement('span');
      ripple.className = 'ui-ripple';
      ripple.style.left = ((event.clientX - rect.left) || rect.width/2) + 'px';
      ripple.style.top = ((event.clientY - rect.top) || rect.height/2) + 'px';
      target.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    }, {passive:true});
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded',install,{once:true});
  else install();
})();
</script>
